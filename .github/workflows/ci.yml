name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vmm:
    # Apple Silicon runner. Hypervisor.framework can't boot guests here (no
    # nested virtualisation), so this builds, lints and unit-tests only.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: brew install libslirp shellcheck
      - name: Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal -c rustfmt,clippy && rustup default 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vmm
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Release build
        run: make build
