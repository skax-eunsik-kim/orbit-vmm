name: Docs

# The English documents are the source of truth. The language selector must be
# current everywhere (scripts/readme-langs.py writes it), a PR that changes an
# English document without touching a translation gets a warning on it, and
# every relative link and in-page anchor must resolve.
on:
  pull_request:
    paths: ["**/*.md", scripts/readme-langs.py, scripts/check-doc-links.py, .github/workflows/readme.yml]

permissions:
  contents: read

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Language selector is current
        run: python3 scripts/readme-langs.py --check
      - name: Translations kept up with the English documents
        run: python3 scripts/readme-langs.py --stale "origin/${{ github.base_ref }}"
      - name: Links and anchors resolve
        run: python3 scripts/check-doc-links.py
