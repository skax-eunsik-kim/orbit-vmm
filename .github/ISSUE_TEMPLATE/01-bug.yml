name: Bug report
description: Something doesn't work or behaves differently from Docker Desktop / OrbStack.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Run `orbit report` first: it fills in the version, Mac and settings below, and saves
        recent logs to a file. Don't attach that file here, this repository is public.
        Send it to your team privately.
  - type: checkboxes
    id: prereqs
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues.
          required: true
        - label: I checked "Known limitations" in the README.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, a minimal compose.yml or Dockerfile if possible.
      render: shell
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Relevant lines from ~/.orbit/vmm/console.log
      description: Only the lines that matter. Please remove anything private (hostnames, paths, tokens).
      render: text
  - type: input
    id: version
    attributes:
      label: orbit version (`orbit status`)
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
      placeholder: Apple M3, 24 GB, macOS 26.1
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Non-default settings
      description: Names of ORBIT_ settings you changed, VPN or network filters, etc.
